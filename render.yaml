services:
  - type: web
    name: ours-ttd
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        sync: false
        description: "Supabase PostgreSQL connection string (Required for production)"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ours-ttd.onrender.com
      - key: GEMINI_API_KEY
        sync: false
        description: "Gemini API Key for AI Assistant (Get from Google AI Studio)"
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
        description: "Google Translate API Key (Optional)"
      - key: GOOGLE_CLOUD_PROJECT_ID
        value: our-ttd-project
