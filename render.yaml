services:
  - type: web
    name: ours-ttd
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ours-ttd-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ours-ttd.onrender.com
      - key: GEMINI_API_KEY
        value: your-gemini-api-key-here
      - key: GOOGLE_TRANSLATE_API_KEY
        value: your-google-translate-api-key-here
      - key: GOOGLE_CLOUD_PROJECT_ID
        value: our-ttd-project

databases:
  - name: ours-ttd-db
    databaseName: ours_ttd
    user: ours_ttd_user
