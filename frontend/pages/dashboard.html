<!-- dashboard.html – user dashboard page -->
<section class="dashboard-page">
  <h2>My Pilgrim Dashboard</h2>
  <div class="grid">
    <section id="profileSection" class="card">
      <h3>Profile</h3>
      <p id="profileName"></p>
      <p id="profileEmail"></p>
      <button class="primary" id="editProfileBtn">Edit Profile</button>
    </section>
    <section id="bookingsSection" class="card">
      <h3>Bookings</h3>
      <ul id="bookingsList"></ul>
    </section>
    <section id="notificationsSection" class="card">
      <h3>Notifications</h3>
      <ul id="notificationsList"></ul>
    </section>
    <section id="healthSection" class="card">
      <h3>Health Reminders</h3>
      <ul id="healthList"></ul>
    </section>
  </div>
</section>
