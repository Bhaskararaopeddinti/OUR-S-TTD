<script>
  function hideLoader() {
    const loadingScreen = document.getElementById('loadingScreen');
    if (loadingScreen) {
      setTimeout(() => {
        loadingScreen.classList.add('hidden');
      }, 500);
    }
  }
  if (document.readyState === 'complete') {
    hideLoader();
  } else {
    window.addEventListener('load', hideLoader);
  }

  // ═══════════════════════════════════════
  // Register Service Worker (PWA)
  // ═══════════════════════════════════════
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/js/sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.warn('SW registration failed:', e));
  }

  // ═══════════════════════════════════════
  // Global Toast helper
  // ═══════════════════════════════════════
  window.showToast = function(msg, type = 'info', duration = 3500) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), duration);
  };

  // ═══════════════════════════════════════
  // Accessibility Panel
  // ═══════════════════════════════════════
  const a11yBtn   = document.getElementById('a11yToggle');
  const a11yPanel = document.getElementById('a11yPanel');
  a11yBtn?.addEventListener('click', () => a11yPanel.classList.toggle('open'));

  document.getElementById('a11yLargeText')?.addEventListener('click', () => {
    document.body.classList.toggle('large-text');
    showToast(document.body.classList.contains('large-text') ? 'Large text enabled' : 'Large text disabled');
  });
  document.getElementById('a11yHighContrast')?.addEventListener('click', () => {
    document.body.classList.toggle('high-contrast');
    showToast('High contrast toggled');
  });
  document.getElementById('a11yReduceMotion')?.addEventListener('click', () => {
    document.body.classList.toggle('reduce-motion');
    showToast('Reduced motion toggled');
  });

  // Close a11y panel on outside click
  document.addEventListener('click', e => {
    if (a11yPanel && !a11yPanel.contains(e.target) && e.target !== a11yBtn) {
      a11yPanel.classList.remove('open');
    }
  });
</script>
